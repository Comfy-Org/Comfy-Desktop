// ----- helpers ---------------------------------------------------------------

function makeBezier(p1x, p1y, p2x, p2y) {
  // cubic bezier easing y(x) for x in [0,1]; falls back to identity if degenerate.
  const cx = 3 * p1x, bx = 3 * (p2x - p1x) - cx, ax = 1 - cx - bx;
  const cy = 3 * p1y, by = 3 * (p2y - p1y) - cy, ay = 1 - cy - by;
  const f = (t, a, b, c) => ((a * t + b) * t + c) * t;
  const fp = (t, a, b, c) => (3 * a * t + 2 * b) * t + c;
  return function(x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) {
      const xt = f(t, ax, bx, cx) - x;
      if (Math.abs(xt) < 1e-5) break;
      const d = fp(t, ax, bx, cx);
      if (Math.abs(d) < 1e-6) break;
      t -= xt / d;
    }
    if (t < 0) t = 0; else if (t > 1) t = 1;
    return f(t, ay, by, cy);
  };
}
const LINEAR = makeBezier(0, 0, 1, 1);

function lerpKf(kfs, t, dim) {
  // kfs: [{t, v, eo?, ei?}, ...]   v is array (length dim) or array of length 3 (we pad)
  // Returns array of length `dim`.
  if (kfs.length === 0) return new Array(dim).fill(0);
  if (kfs.length === 1 || t <= kfs[0].t) {
    const v = kfs[0].v;
    return v.slice(0, dim);
  }
  if (t >= kfs[kfs.length - 1].t) {
    const v = kfs[kfs.length - 1].v;
    return v.slice(0, dim);
  }
  // Find segment
  let i = 0;
  while (i < kfs.length - 1 && kfs[i + 1].t <= t) i++;
  const a = kfs[i], b = kfs[i + 1];
  const span = b.t - a.t;
  if (span <= 0) return a.v.slice(0, dim);
  const x = (t - a.t) / span;
  // Easing: out tangent of a, in tangent of b
  let eased = x;
  if (a.eo && b.ei) {
    // Cache the easer on the keyframe pair
    if (!a._easer) a._easer = makeBezier(a.eo[0], a.eo[1], b.ei[0], b.ei[1]);
    eased = a._easer(x);
  }
  const out = [];
  for (let k = 0; k < dim; k++) {
    const av = a.v[k] !== undefined ? a.v[k] : 0;
    const bv = b.v[k] !== undefined ? b.v[k] : 0;
    out.push(av + (bv - av) * eased);
  }
  return out;
}

// ----- build DOM -------------------------------------------------------------

const stage = document.getElementById('stage');
const COMP_W = DATA.compW, COMP_H = DATA.compH;

// Use absolute pixel coordinates inside .stage by scaling .stage to comp size,
// then letting CSS aspect-ratio handle responsive scaling via the wrapper.
stage.style.width = COMP_W + 'px';
stage.style.height = COMP_H + 'px';
stage.style.transformOrigin = 'top left';

function fitStage() {
  const wrap = stage.parentElement;
  const sx = wrap.clientWidth / COMP_W;
  const sy = wrap.clientHeight / COMP_H;
  const s = Math.min(sx, sy);
  stage.style.transform = `scale(${s})`;
}
window.addEventListener('resize', fitStage);

const sceneEls = [];
DATA.scenes.forEach((scene, idx) => {
  const el = document.createElement('div');
  el.className = 'scene';
  el.style.zIndex = (DATA.scenes.length - idx); // earlier in array = on top
  el.style.borderRadius = scene.maskRadius + 'px';
  // Pre-create one <video> element per video layer in the scene.
  const videos = scene.videos.map((v, vi) => {
    const ve = document.createElement('video');
    ve.src = v.src;
    ve.muted = true;
    ve.playsInline = true;
    ve.preload = 'auto';
    ve.loop = false;
    ve.dataset.idx = vi;
    el.appendChild(ve);
    return ve;
  });
  stage.appendChild(el);
  sceneEls.push({ el, videos, activeIdx: -1, scene });
});

// ----- timeline driver -------------------------------------------------------

const FPS = DATA.fps;
// Embed only: the scene was cut for a website hero, and at full speed it reads
// as a burst next to a progress bar that will sit there for minutes.
const SPEED = 0.55;
const DURATION = DATA.duration;       // frames
const DURATION_S = DURATION / FPS;

let playing = false;
let startEpoch = 0;        // performance.now() at masterFrame=0
let masterFrame = 0;       // current frame
let lastTickFrame = -1;

const seekEl = document.getElementById('seek');
const timeEl = document.getElementById('time');
seekEl.max = DURATION;

function setMasterFrame(f, fromUserSeek = false) {
  masterFrame = Math.max(0, Math.min(DURATION, f));
  startEpoch = performance.now() - (masterFrame / FPS) * 1000;
  if (fromUserSeek) {
    // Force re-sync of all active videos
    for (const s of sceneEls) s.activeIdx = -2;
  }
}

function play() {
  if (masterFrame >= DURATION) setMasterFrame(0, true);
  startEpoch = performance.now() - (masterFrame / FPS) * 1000;
  playing = true;
  // Resume currently visible videos
  for (const s of sceneEls) {
    for (const v of s.videos) if (v.classList.contains('active')) v.play().catch(() => {});
  }
}
function pause() {
  playing = false;
  for (const s of sceneEls) for (const v of s.videos) v.pause();
}

document.getElementById('play').onclick = play;
document.getElementById('pause').onclick = pause;
document.getElementById('restart').onclick = () => { setMasterFrame(0, true); play(); };
seekEl.oninput = () => { setMasterFrame(parseFloat(seekEl.value), true); render(); };

// Render every frame
function render() {
  for (const s of sceneEls) {
    const scene = s.scene;
    const pt = masterFrame - scene.outerSt;     // precomp time

    // Outer container offset (delta from natural [528, 392] center)
    const outer = lerpKf(scene.outerPos, masterFrame, 2);
    const dx = outer[0] - 528;
    const dy = outer[1] - 392;

    // Mask center in precomp coords (incl. group offset)
    const mp = lerpKf(scene.maskPos, pt, 2);
    const mz = lerpKf(scene.maskSize, pt, 2);
    const grp = scene.maskGroupOffset;
    const cx = mp[0] + grp[0] + dx;
    const cy = mp[1] + grp[1] + dy;
    const mw = mz[0], mh = mz[1];

    // Position the mask container at mask rect top-left
    const left = cx - mw / 2;
    const top  = cy - mh / 2;
    s.el.style.transform = `translate(${left}px, ${top}px)`;
    s.el.style.width  = mw + 'px';
    s.el.style.height = mh + 'px';

    // Find active video layer (topmost visible)
    let activeIdx = -1;
    for (let i = 0; i < scene.videos.length; i++) {
      const v = scene.videos[i];
      if (pt >= v.ip && pt < v.op) { activeIdx = i; break; }
    }

    // Switch active if changed
    if (activeIdx !== s.activeIdx) {
      for (const ve of s.videos) {
        ve.classList.remove('active');
        ve.pause();
      }
      if (activeIdx >= 0) {
        const v = scene.videos[activeIdx];
        const ve = s.videos[activeIdx];
        const sourceTime = (pt - v.st) / FPS;
        const safe = Math.max(0, Math.min(sourceTime, (ve.duration || 60) - 0.001));
        try { ve.currentTime = safe; } catch (_) {}
        ve.classList.add('active');
        if (playing) ve.play().catch(() => {});
      }
      s.activeIdx = activeIdx;
    }

    // Position the active video element inside the mask container
    if (activeIdx >= 0) {
      const v = scene.videos[activeIdx];
      const ve = s.videos[activeIdx];
      const sc = lerpKf(v.scale, pt, 2);   // [scaleX%, scaleY%]
      const vp = lerpKf(v.pos,   pt, 2);
      const sxF = sc[0] / 100, syF = sc[1] / 100;
      const vw = COMP_W * sxF;
      const vh = COMP_H * syF;
      // Anchor [528,392] of source maps to (maskPos + videoPos) in precomp.
      // Within mask container (top-left at maskCenter - maskSize/2), anchor lands at:
      //   anchorInMask = (maskPos + videoPos) - (maskCenter - maskSize/2)
      //                = videoPos - groupOffset + maskSize/2
      const anchorXInMask = vp[0] - grp[0] + mw / 2;
      const anchorYInMask = vp[1] - grp[1] + mh / 2;
      // Video top-left = anchor - scale*[528, 392]
      const vLeft = anchorXInMask - sxF * 528;
      const vTop  = anchorYInMask - syF * 392;
      ve.style.width  = vw + 'px';
      ve.style.height = vh + 'px';
      ve.style.transform = `translate(${vLeft}px, ${vTop}px)`;
    }
  }

  // Update UI
  seekEl.value = masterFrame;
  timeEl.textContent = (masterFrame / FPS).toFixed(2) + ' / ' + DURATION_S.toFixed(2);
}

function tick(now) {
  if (playing) {
    masterFrame = ((now - startEpoch) / 1000) * FPS * SPEED;
    if (masterFrame >= DURATION) {
      // Loop
      masterFrame = 0;
      startEpoch = now;
      for (const s of sceneEls) s.activeIdx = -2; // force re-seek
    }
  }
  if (Math.floor(masterFrame) !== lastTickFrame) {
    render();
    lastTickFrame = Math.floor(masterFrame);
  }
  requestAnimationFrame(tick);
}

// Boot
fitStage();
render();
requestAnimationFrame(tick);

// Autoplay (muted, so allowed in Chrome)
window.addEventListener('load', () => {
  setTimeout(play, 50);
});
