name: CI - Cursor Review

on:
  pull_request:
    types: [labeled, unlabeled]

concurrency:
  group: cursor-review-pr-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  cursor-review:
    permissions:
      contents: read
      pull-requests: write
    uses: Comfy-Org/github-workflows/.github/workflows/cursor-review.yml@ece4c3eaa71812a5a665f48d5d1f4bb0ff5f655e # github-workflows main (ece4c3e)
    with:
      workflows_ref: ece4c3eaa71812a5a665f48d5d1f4bb0ff5f655e
      diff_excludes: >-
        :!**/pnpm-lock.yaml
        :!**/package-lock.json
        :!**/yarn.lock
        :!**/node_modules/**
        :!**/.claude/**
        :!**/dist/**
        :!**/vendor/**
        :!**/*.generated.*
        :!**/*.min.js
        :!**/*.min.css
        :!**/*-snapshots/**
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
