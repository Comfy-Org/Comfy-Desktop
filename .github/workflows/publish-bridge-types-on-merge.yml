name: Publish Bridge Types on Merge

# `push`, not `pull_request: closed`: fork PRs get no secrets on pull_request,
# and this covers squash/rebase merges and direct pushes alike.
on:
  push:
    branches: [main]
    paths:
      - 'packages/comfyui-desktop-bridge-types/package.json'

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve Version and Dist Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      dist_tag: ${{ steps.dist.outputs.dist_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Read bridge-types version
        id: get_version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/comfyui-desktop-bridge-types/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine dist-tag
        id: dist
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish Bridge Types to npm
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/publish-bridge-types.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      dist_tag: ${{ needs.resolve.outputs.dist_tag }}
      ref: ${{ github.sha }}
      # main must never carry a version npm already serves under different
      # contents, so a collision here is an error rather than a skip.
      require_publish: true
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
