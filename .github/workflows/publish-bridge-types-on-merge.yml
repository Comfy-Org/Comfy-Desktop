name: Publish Bridge Types on Merge

# `push`, not `pull_request: closed`: fork PRs get no secrets on pull_request,
# and this covers squash/rebase merges and direct pushes alike.
on:
  push:
    branches: [main]
    # Not package.json alone: two PRs that bump to the same version merge
    # without conflict, so main's package.json can be unchanged while the
    # contract moved. Watch everything that ships and let the publish job
    # decide whether npm is already serving it.
    paths:
      - 'packages/comfyui-desktop-bridge-types/**'

permissions:
  contents: read

jobs:
  publish:
    name: Publish Bridge Types to npm
    permissions:
      contents: read
    # Version and dist-tag are read from the checked-out commit, so there is
    # no separate resolve job and no handoff to keep in sync.
    uses: ./.github/workflows/publish-bridge-types.yml
    with:
      ref: ${{ github.sha }}
      # main must never carry declarations npm serves differently under the
      # same version, so that collision is an error rather than a skip.
      require_publish: true
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
