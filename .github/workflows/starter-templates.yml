name: Starter templates

# Guards `assets/starter-templates.json`, which desktop reads from R2 at boot.
# A bad edit is silent in the app: a short tab quietly backfills and a paid
# auto-pick spends the user's credits, so it has to fail here instead.
on:
  pull_request:
    paths:
      - 'assets/starter-templates.json'
      - 'scripts/starter-templates.mjs'
      - 'scripts/starter-templates.spec.mjs'
      - '.github/workflows/starter-templates.yml'
  push:
    branches: [main]
    paths:
      - 'assets/starter-templates.json'
      - '.github/workflows/starter-templates.yml'
  # Lets us prove the credentials work before merging, rather than finding out
  # on the merge that publishes to users.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check credentials without touching the published file'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Checks the tab counts and the one-paid-per-tab rule, and confirms every
      # id still exists upstream.
      - run: node scripts/starter-templates.mjs validate

      # Every way an edit can break the picker silently: wrong counts, a paid
      # auto-pick, a duplicate id, a free card with no size.
      # `node --test`, so this needs no dependency install.
      - name: guardrails hold
        run: node --test scripts/starter-templates.spec.mjs

      # A hand-edit that skipped the script would drift from the index, so
      # regenerating must be a no-op.
      # A warning, not a failure: these fields are refreshed from upstream's
      # `main`, so an unrelated edit there would otherwise redden every open PR
      # and send the author hunting a hand-edit that does not exist.
      - name: display fields match the live index
        run: |
          node scripts/starter-templates.mjs regenerate >/dev/null
          if ! git diff --quiet -- assets/starter-templates.json; then
            echo "::warning::Display fields differ from upstream. If this PR did not"
            echo "::warning::edit them, upstream changed: run"
            echo "::warning::  node scripts/starter-templates.mjs regenerate"
            git diff -- assets/starter-templates.json
          fi
          git checkout -- assets/starter-templates.json

  # Merging to main publishes the list. Desktop reads it at boot, so users pick
  # the change up on their next launch with no app release.
  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: starter-templates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Uploaded to both hosts: regions where R2's edge is throttled read the
      # GCS mirror, and a list that exists on only one of them is invisible to
      # half the users it was written for.
      - name: publish to R2
        if: inputs.dry_run != true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.R2_STARTER_TEMPLATES_TOKEN }}
        run: |
          npx --yes wrangler@3 r2 object put \
            desktop-assets/standalone-environments/starter-templates.json \
            --file assets/starter-templates.json \
            --content-type application/json

      # Runs on a dry run too: a bad service-account key fails here.
      - name: authenticate to GCS
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCS_MIRROR_SA_KEY }}
      - uses: google-github-actions/upload-cloud-storage@v2
        if: inputs.dry_run != true
        with:
          path: assets/starter-templates.json
          destination: comfy-desktop-public/standalone-environments
          headers: |-
            content-type: application/json

      # A real write and delete under a throwaway key, so the token is proven to
      # have write access without touching the file users read.
      # Diagnoses the token rather than just failing: which permissions it
      # carries, and whether the bucket is even in this account.
      - name: dry run - what the R2 token can actually do
        if: inputs.dry_run == true
        continue-on-error: true
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.R2_STARTER_TEMPLATES_TOKEN }}
        run: |
          echo "### R2" >> "$GITHUB_STEP_SUMMARY"

          verify=$(curl -s https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer $CF_TOKEN")
          if [ "$(echo "$verify" | jq -r .success)" != "true" ]; then
            echo "- Token is not valid: $(echo "$verify" | jq -c '.errors')" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- Token is valid and active" >> "$GITHUB_STEP_SUMMARY"

          # Does the token see the bucket at all? Distinguishes "wrong account
          # or no R2 scope" from "read but not write".
          buckets=$(curl -s -o /tmp/buckets.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets" \
            -H "Authorization: Bearer $CF_TOKEN")
          if [ "$buckets" = "200" ]; then
            if jq -e '.result.buckets[]? | select(.name=="desktop-assets")' /tmp/buckets.json >/dev/null; then
              echo "- Can list buckets, and desktop-assets is in this account" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- Can list buckets, but desktop-assets is NOT in this account" >> "$GITHUB_STEP_SUMMARY"
              echo "  Visible: $(jq -r '[.result.buckets[]?.name] | join(", ")' /tmp/buckets.json)" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "- Cannot list buckets (HTTP $buckets) - token lacks an R2 read scope on this account" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Read the file we would overwrite, to separate read from write.
          readc=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/desktop-assets/objects/standalone-environments/starter-templates.json" \
            -H "Authorization: Bearer $CF_TOKEN")
          echo "- Read the published file: HTTP $readc" >> "$GITHUB_STEP_SUMMARY"

          KEY="standalone-environments/.credential-check-${{ github.run_id }}.json"
          echo '{"check":true}' > /tmp/check.json
          writec=$(curl -s -o /tmp/write.json -w '%{http_code}' -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/desktop-assets/objects/$KEY" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" --data-binary @/tmp/check.json)
          echo "- Write a throwaway object: HTTP $writec" >> "$GITHUB_STEP_SUMMARY"
          if [ "$writec" = "200" ]; then
            curl -s -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/desktop-assets/objects/$KEY" \
              -H "Authorization: Bearer $CF_TOKEN" >/dev/null
            echo "- Cleaned up. **R2 is ready.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Refused: $(jq -c '.errors' /tmp/write.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Needs an R2 token with Object Read & Write on desktop-assets.**" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Separate step, so an R2 failure never hides the mirror's status.
      - name: dry run - what the GCS key can actually do
        if: inputs.dry_run == true
        continue-on-error: true
        run: |
          echo "### GCS mirror" >> "$GITHUB_STEP_SUMMARY"
          echo "- Authenticated as $(gcloud config get-value account 2>/dev/null)" >> "$GITHUB_STEP_SUMMARY"
          KEY=".credential-check-${{ github.run_id }}.json"
          echo '{"check":true}' > /tmp/check.json
          if gcloud storage cp /tmp/check.json "gs://comfy-desktop-public/standalone-environments/$KEY" 2>/tmp/gcs.err; then
            gcloud storage rm "gs://comfy-desktop-public/standalone-environments/$KEY" >/dev/null 2>&1
            echo "- Wrote and deleted a throwaway object. **Mirror is ready.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Refused: \`$(tail -2 /tmp/gcs.err | tr '\n' ' ')\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Needs Storage Object Admin on comfy-desktop-public.**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: confirm both hosts serve it
        if: inputs.dry_run != true
        run: |
          for url in \
            https://desktop-assets.comfy.org/standalone-environments/starter-templates.json \
            https://storage.googleapis.com/comfy-desktop-public/standalone-environments/starter-templates.json
          do
            code=$(curl -s -o /tmp/got.json -w '%{http_code}' "$url")
            if [ "$code" != "200" ]; then
              echo "::error::$url returned $code"
              exit 1
            fi
            if ! diff -q /tmp/got.json assets/starter-templates.json >/dev/null; then
              echo "::error::$url is serving different content than we just published"
              exit 1
            fi
          done
          echo "Published. Desktop users get this on their next launch."
