# Temporary diagnostics: #1707 combined with the Storybook branch's Playwright 1.64. Not for merge.
name: diag-beta-args-pw164

on:
  push:
    branches:
      - bl/diag-beta-args-pw164

permissions:
  contents: read

jobs:
  linux:
    name: linux ${{ matrix.job }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { job: as-ci, patch: '', load: '0' }
          - { job: loaded, patch: '', load: '1' }
          - { job: mutant-optout, patch: optout, load: '0' }
          - { job: mutant-always-grant, patch: always-grant, load: '0' }
          - { job: mutant-always-grant-slow, patch: always-grant-slow, load: '0' }
    steps:
      - uses: actions/checkout@v7
      - name: Record the combined commit
        run: git log --format='%H %P %s' -1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply ${{ matrix.patch }}
        if: matrix.patch != ''
        run: git apply --verbose .github/diag-beta-args/${{ matrix.patch }}.patch && git diff --stat
      - run: pnpm run build
      - name: Saturate the CPUs
        if: matrix.load == '1'
        run: |
          for _ in $(seq "$(nproc)"); do nohup sh -c 'while :; do :; done' >/dev/null 2>&1 & done
          sleep 1
          uptime
      - name: Run ${{ matrix.job }}
        run: .github/diag-beta-args/cases.sh ${{ matrix.job }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diag-pw164-linux-${{ matrix.job }}
          path: logs/
          retention-days: 7

  native:
    name: ${{ matrix.project }} pill spec
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: windows, os: windows-latest }
          - { project: macos, os: macos-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright --version
      - run: pnpm run build
      - name: Pill spec x10, as built
        run: |
          mkdir -p logs
          set +e
          pnpm exec playwright test --project=${{ matrix.project }} --retries=0 --reporter=list \
            e2e/core-beta-args-pill.test.ts --repeat-each=10 > logs/as-built.log 2>&1
          echo "exit $?"
          grep -E '^\s+[0-9]+ (passed|failed|flaky|skipped|did not run)|^\s+[0-9]+\) |^\s+Error: ' logs/as-built.log
          exit 0
      - name: Rebuild with every answer offering a grant
        run: node .github/diag-beta-args/always-grant.mjs && git diff --stat && pnpm run build
      - name: Unpredictable next launch x2, mutant
        run: |
          set +e
          pnpm exec playwright test --project=${{ matrix.project }} --retries=0 --reporter=list \
            e2e/core-beta-args-pill.test.ts --grep 'whose next launch cannot be predicted' --repeat-each=2 > logs/mutant.log 2>&1
          echo "exit $?"
          grep -E '^\s+[0-9]+ (passed|failed|flaky|skipped|did not run)|^\s+[0-9]+\) |^\s+Error: |^\s+at .*betaArgsAnswers\.ts:[0-9]+|^\s+\+   ' logs/mutant.log
          exit 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diag-pw164-${{ matrix.project }}
          path: logs/
          retention-days: 7
