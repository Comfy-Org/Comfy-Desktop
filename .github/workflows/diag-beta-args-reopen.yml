# Temporary diagnostics for the beta-args reopen PR. Not for merge.
name: diag-beta-args-reopen

on:
  push:
    branches:
      - bl/diag-beta-args-reopen

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { job: as-ci, patch: '', load: '0', quiet: '0' }
          - { job: loaded, patch: '', load: '1', quiet: '0' }
          - { job: quiet, patch: quiet, load: '0', quiet: '1' }
          - { job: mutant-optout, patch: optout, load: '0', quiet: '0' }
          - { job: mutant-optout-slow, patch: optout-slow, load: '0', quiet: '0' }
          - { job: mutant-always-grant, patch: always-grant, load: '0', quiet: '0' }
          - { job: mutant-always-grant-slow, patch: always-grant-slow, load: '0', quiet: '0' }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply ${{ matrix.patch }}
        if: matrix.patch != ''
        run: git apply --verbose .github/diag-beta-args/${{ matrix.patch }}.patch && git diff --stat
      - run: pnpm run build
      - name: Saturate the CPUs
        if: matrix.load == '1'
        run: |
          for _ in $(seq "$(nproc)"); do nohup sh -c 'while :; do :; done' >/dev/null 2>&1 & done
          sleep 1
          uptime
      - name: Run ${{ matrix.job }}
        env:
          DIAG_QUIET: ${{ matrix.quiet }}
        run: .github/diag-beta-args/cases.sh ${{ matrix.job }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diag-beta-args-${{ matrix.job }}
          path: logs/
          retention-days: 7
