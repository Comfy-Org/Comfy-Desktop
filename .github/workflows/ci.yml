name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quit-with-fix-under-gdb:
    name: Quit with forced GC, with the fix, under gdb (${{ matrix.replica }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm run build

      - name: Install gdb
        run: (sudo apt-get update && sudo apt-get install -y --no-install-recommends gdb) || echo "gdb is not available"

      - name: Run the quit test
        env:
          TEARDOWN_DIAG_GDB: '1'
        run: xvfb-run --auto-servernum pnpm exec playwright test --project=linux e2e/quit-garbage-collection.test.ts --retries=0 --reporter=list
