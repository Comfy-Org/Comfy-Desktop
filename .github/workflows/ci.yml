name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  teardown-diag:
    name: Teardown diag (${{ matrix.load }} ${{ matrix.replica }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        load: [gdb, plain]
        replica: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm run build

      - name: Install gdb
        run: (sudo apt-get update && sudo apt-get install -y --no-install-recommends gdb) || echo "gdb is not available"

      - name: Repeat the picker spec
        env:
          LOAD: ${{ matrix.load }}
        run: |
          for i in 1 2 3; do ( while :; do :; done ) & done
          if [ "$LOAD" = gdb ]; then export TEARDOWN_DIAG_GDB=1; fi
          xvfb-run --auto-servernum pnpm exec playwright test --project=linux e2e/picker-cluster.test.ts --repeat-each=80 --retries=0 --reporter=list
