name: Build Bootstrap Python

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New release tag for the bootstrap-python assets (e.g. bootstrap-v4)'
        required: true
        default: 'bootstrap-v4'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win-x64
            os: windows-latest
          # Native Windows on Arm (NVIDIA RTX Spark). GitHub's arm64 Windows
          # runners are free for public repositories.
          - platform: win-arm64
            os: windows-11-arm
          - platform: mac-arm64
            os: macos-latest
          - platform: linux-x64
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version-file: .nvmrc

      - name: Build bootstrap Python
        # The script downloads python-build-standalone, installs pygit2, and
        # places a pinned uv binary alongside python. No system Python or
        # uv is required — all Python invocations use the just-extracted
        # interpreter.
        run: node scripts/build-bootstrap-python.mjs --platform ${{ matrix.platform }} --output bootstrap-python

      - name: Package archive
        shell: bash
        run: |
          cd bootstrap-python
          tar -czf ../bootstrap-python-${{ matrix.platform }}.tar.gz ${{ matrix.platform }}
          ls -lh ../bootstrap-python-${{ matrix.platform }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-python-${{ matrix.platform }}
          path: bootstrap-python-${{ matrix.platform }}.tar.gz

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          files: bootstrap-python-${{ matrix.platform }}.tar.gz
          fail_on_unmatched_files: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
