name: Visual regression

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Visual components (Linux)
    runs-on: ubuntu-24.04
    # The browser, fonts and system libraries come from this image, so a runner or apt update
    # can't move pixels. Its tag must match the Playwright version in pnpm-lock.yaml.
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # The renderer fixture doesn't run Electron or native addons.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compare visual baselines
        run: pnpm run test:visual
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-linux
          path: |
            visual-playwright-report/
            visual-test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Regenerate baselines for review
        if: failure()
        continue-on-error: true
        run: pnpm run test:visual:update --reporter=list --output="$RUNNER_TEMP/visual-update-results"
      - name: Upload regenerated baselines
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-linux
          path: tests/visual/__screenshots__/linux/
          retention-days: 14
          if-no-files-found: ignore
