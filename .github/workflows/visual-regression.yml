name: Visual comparison

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Visual report (base vs PR)
    runs-on: ubuntu-24.04
    # Both versions use this browser on the same runner. Match the lockfile's
    # Playwright version; there are no committed images to regenerate.
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check report generation
        run: pnpm test:visual:unit
      - name: Render base and PR
        env:
          VISUAL_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: pnpm test:visual
      - name: Upload comparison report
        id: report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-comparison
          path: visual-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Publish comparison summary
        if: always()
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          if [ -f visual-report/summary.md ]; then
            cat visual-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Visual comparison could not run. See the job logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$REPORT_URL" ]; then
            printf '\n[Download the before/after/diff report](%s) and open index.html.\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
