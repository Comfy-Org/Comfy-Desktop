name: Lifecycle Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: lifecycle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    name: Lifecycle (windows)
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-lifecycle'
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch bootstrap Python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run bootstrap:fetch

      - name: Build app
        run: pnpm run build

      - name: Run lifecycle tests
        env:
          LIFECYCLE_VARIANT: cpu
        run: pnpm run test:e2e:lifecycle

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-lifecycle-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
