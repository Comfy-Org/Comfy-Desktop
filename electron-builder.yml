appId: com.todesktop.241012ess7yxs0e
productName: Comfy Desktop
directories:
  buildResources: resources
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!eslint.config.ts'
  - '!{.eslintcache,.prettierrc.json,README.md,AGENTS.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.env,.env.*,.npmrc}'
  - '!docs/*'
  - '!out/**/*.map'
  - '!reference/*'
  - '!**/*.wsb'
extraResources:
  - from: lib
    to: lib
asarUnpack:
  - node_modules/7zip-bin/**/*
  - node_modules/node-pty/**/*
afterPack: ./scripts/afterPack.mjs
publish:
  provider: github
  owner: Comfy-Org
  repo: Comfy-Desktop
artifactName: Comfy-Desktop-${version}-${os}-${arch}.${ext}
win:
  target: nsis
  icon: assets/Comfy_Logo_x256.png
  extraResources:
    - from: bootstrap-python/win-${arch}
      to: bootstrap-python
      filter:
        - '**/*'
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  include: scripts/installer.nsh
mac:
  target:
    - dmg
    - zip
  icon: assets/Comfy_Logo_mac_x1024.png
  category: public.app-category.developer-tools
  extraResources:
    - from: bootstrap-python/mac-arm64
      to: bootstrap-python
      filter:
        - '**/*'
dmg:
  title: Comfy Desktop
  background: dmg/background.png
  iconSize: 84
  iconTextSize: 11
  window:
    width: 540
    height: 400
  contents:
    - x: 135
      y: 195
      type: file
    - x: 405
      y: 195
      type: link
      path: /Applications
linux:
  target:
    - AppImage
    - deb
  icon: assets/Comfy_Logo_x512.png
  category: Development
  extraResources:
    - from: resources/apparmor-profile
      to: apparmor-profile
    - from: bootstrap-python/linux-${arch}
      to: bootstrap-python
      filter:
        - '**/*'
deb:
  afterInstall: scripts/after-install.sh
  afterRemove: scripts/after-remove.sh
